<!DOCTYPE html>
<html>
<head>
	<title>CSS Animations</title>
	<style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #333;
            position: relative;
            animation: none;
        }
        .btn {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
        }
        .btn:hover {
            cursor: pointer;
        }
        .animate {
            animation: move 2s forwards;
        }
        @keyframes move {
            0% {
                transform: translateX(0);
                background-color: #333;
            }
            50% {
                transform: translateX(100px);
                background-color: #666;
            }
            100% {
                transform: translateX(0);
                background-color: #333;
            }
        }
    </style>
</head>
<body>
	<div class="box"></div>
	<button class="btn">Animate</button>
</body>
</html>
