<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-between;
        }
        
        nav li {
            margin-right: 20px;
        }
        
        nav a {
            text-decoration: none;
            color: #333;
        }
        
        /* Media Queries */
        
        @media (max-width: 767px) {
            nav ul {
                flex-direction: column;
            }
            nav li {
                margin: 10px 0;
            }
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .gallery img {
            width: 30%;
            margin: 10px;
            border-radius: 10px;
        }
        
        /* Media Queries */
        
        @media (max-width: 767px) {
            .gallery img {
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="gallery">
        <img src="images.jpeg" alt="Image 1">
        <img src="images.jpeg" alt="Image 2">
        <img src="images.jpeg" alt="Image 3">
    </div>
</body>
</html>
