<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        nav li {
            display: inline-block;
            margin-right: 20px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2em;
        }
        section {
            background-color: #f7f7f7;
            padding: 1em;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
            clear: both;
        }
        /* Media Queries */
        /* Desktop */
        @media (min-width: 1200px) {
            main {
                flex-direction: row;
            }
            section {
                width: 30%;
                margin: 20px;
            }
        }
        /* Tablet */
        @media (min-width: 768px) and (max-width: 1199px) {
            main {
                flex-direction: column;
            }
            section {
                width: 100%;
                margin: 20px 0;
            }
        }
        /* Mobile */
        @media (max-width: 767px) {
            header {
                padding: 0.5em;
            }
            nav ul {
                display: flex;
                flex-direction: column;
            }
            nav li {
                margin: 10px 0;
            }
            main {
                padding: 1em;
            }
            section {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Welcome to Responsive Design</h1>
            <p>This is a responsive design example.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Responsive Design</p>
    </footer>
</body>
</html>
