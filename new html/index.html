<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }
        body{
            background-image: url('images.jpeg' );
            
            background-repeat: no-repeat;
        }
        section{
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container{
            display: inline-block;
            align-items: center;
            justify-content: center;
            position: absolute;
            border: 1px solid;
            width: 400px;
            height: 300px;
            border-radius: 10px;
            background-color: rgba(251, 255, 0, 0.678);
            box-shadow: 0 20px 40px;
        }
        h2{
            font-size: xx-large;
            font-style: italic;
            margin-top: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .username{
            font-style: italic;
            margin-top: 10px;
            padding: 10px;
            width: 250px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 26px;
            border-radius: 8px;
            border: none;
            font-size: medium;
        }
        .password{
            font-style: italic;
            margin-top: 10px;
            padding: 10px;
            width: 250px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 26px;
            border-radius: 8px;
            border: none;
            font-size: medium;
        }
        .check{
            margin-top: 10px;
            margin-left: 14px;
        }
        button{
            margin-top: 40px;
            margin-left: 150px;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 8px;
            border: none;
            background-color: rgba(234, 0, 255, 0.301);
            font-size: medium;
            font-weight: bolder;
            color: white;
        }
        .forgot{
            margin-top: 5px;
            margin-right: 15px;
            float: right;
        }
    </style>
</head>
<body>
    <section>
        <div class="container">
            <div class="login">
                <h2>Sign Up</h2>
            </div>
            <div>
                <input type="text" name="username" placeholder="Username" class="username" required>
            </div>
            <div>
                <input type="password" placeholder="Enter password" class="password" required>
            </div>
            <div class="check">
                <span><input type="checkbox" class="check">Remeber me.</span>
            </div>
            <button class="signup">Login</button>
            <div class="forgot"> Forgot <a href="#">password?</a></div>
        </div>
    </section>
</body>
</html>
