<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Name</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        header {
            text-align: center;
            padding: 10px;
            background-color: black;
            color: #fff;
        }
        header img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        section {
            margin: 20px;
        }
        .project {
            width: 200px; /* Square dimensions */
            height: 200px;
            border: 1px solid #333;
            margin: 10px;
            display: inline-block; /* Aligns the containers side by side */
            text-align: center;
            line-height: 200px; /* Vertically centers the text */
        } 
        h1, h2 {
            color: #333;
        }
        #bio, #work {
            background-color: #e9e9e9;
            padding: 15px;
        }
        footer {
            background-color:black;
            text-align: center;
            padding: 10px;
            color: #fff;
        }        
    </style>
</head>
<body>
    <div class="div1">
    <header>
    <img src="images.png" alt="Image1">
    <h1>Your Name</h1>
    <div>Web Designer | Web Developer | Technology</div>
    </header>
    <section>
        <h3>About Me</h3>
        <div>[My Biography]</div>
    </section>
    <section class="work">
            <h2>My Work</h2>
            <div class="project" id="project1">Project 1</div>
            <div class="project" id="project2">Project 2</div>
            <div class="project" id="project3">Project 3</div>
        </section>
        <footer>
            <p>Contact me at [your email]</p>
        </footer>
    </div>
</body>
</html>
