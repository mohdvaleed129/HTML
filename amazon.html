<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Nike_Black_Running_Shoes{
         color : black;
         font-weight : bolder ;
        font-size : 23px;
        }
        .stock {
            color : rgb( 0, 118, 0);
            font-size : 18px;
        }
        .add_to_cart{
            background-color : yellow;
            color : black;
            border : none;
            height :30px;
            width : 160px;
            border-radius : 18px;
            cursor : pointer;
            font-size: small;
            font-weight  : bold;
        }
        .add_to_cart:hover {
            background-color :rgb(255, 164, 28);
        }
        .add_to_cart:active{
            opacity : 0.8;
        }
        .buy_now{
            background-color : rgb(255, 164, 28);
            color : black;
            height : 30px;
            width : 150px;
            border : none;
            border-radius : 18px;
            font-weight: bolder ;
            margin-left : 5px;
        }
        .buy_now:hover {
            background-color :rgb(153, 92, 0)
        }
        .buy_now:active {
            opacity : 0.8;
        
        }
        .free_delivery{
            font-size : 20px;
        }
        .amazon{
            font-size : 18px;
        }
        .amazon:hover {
            color :rgb(194, 255, 28)
        }
        </style>        
</head>
<body>
    <a class ="amazon" href = "https://www.amazon.com/">Link to Amazon </a>
<p class ="Nike_Black_Running_Shoes"> Nike Black Running Shoes</p>
<p class ="stock"> $39 - in Stock</p>
<p class = "free_delivery"> Free Delivery Tomorrow</p>
<button class ="add_to_cart">Add to Cart</button> <button class="buy_now">Buy Now</button>
</body>
</html>
