<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Registration</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
            background: url('train3.avif');
            background-size: cover;
            background-position: center;
        }
        header{
            text-align: center;
            padding: 20px;
        }
        .form{
            text-align: center;
            flex-direction: column;
            border: 1px solid #333;
        }
        nav{
            display: flex;
            list-style: none;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome For Ticket Booking Services</h1>
    </header>
    <form class="form">
        <h2>Fill Your Details</h2>
        <label>Enter Username</label>
        <input type="name" placeholder="Your Name"><br><br>
        <label>Date of Birth</label>
        <input type="date" placeholder="DD:MM:YY"><br><br>
        <label>Gender :</label>
        <ul>
            <li><input type="radio" name="gender">Male<br></li>
            <li><input type="radio" name="gender">Female<br></li>
            <li><input type="radio" name="gender">Other<br></li>
        </ul>
        <label>Choose Your City</label>
        <select>
            <option>Select</option>
            <option>Agra</option>
            <option>Bareilly</option>
            <option>Chandigarh</option>
            <option>Dehradun</option>
            <option>Etawa</option>
            <option>Faridpur</option>
        </select>
        <button>Submit</button>
    </form>
</body>
</html>
