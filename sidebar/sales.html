<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="flex">
        <div class="bg-light-secondary dark:bg-dark-secondary p-6 rounded w-full md:w-1/2 transition-colors duration-300">
            <h3 class="text-lg font-semibold mb-4">Sales by Country</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 dark:border-gray-700">
                            <th class="pb-2 text-left">Country</th>
                            <th class="pb-2 text-left">Sales</th>
                            <th class="pb-2 text-left">Value</th>
                            <th class="pb-2 text-left">Bounce</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-200 dark:border-gray-700">
                            <td class="py-2 flex items-center gap-2"><span>🇺🇸</span> United States</td>
                            <td class="py-2">2,500</td>
                            <td class="py-2">$230,900</td>
                            <td class="py-2">29.9%</td>
                        </tr>
                        <tr class="border-b border-gray-200 dark:border-gray-700">
                            <td class="py-2 flex items-center gap-2"><span>🇩🇪</span> Germany</td>
                            <td class="py-2">3,900</td>
                            <td class="py-2">$440,000</td>
                            <td class="py-2">40.22%</td>
                        </tr>
                        <tr class="border-b border-gray-200 dark:border-gray-700">
                            <td class="py-2 flex items-center gap-2"><span>🇬🇧</span> Great Britain</td>
                            <td class="py-2">1,400</td>
                            <td class="py-2">$190,700</td>
                            <td class="py-2">23.44%</td>
                        </tr>
                        <tr>
                            <td class="py-2 flex items-center gap-2"><span>🇧🇷</span> Brazil</td>
                            <td class="py-2">562</td>
                            <td class="py-2">$143,960</td>
                            <td class="py-2">32.14%</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
