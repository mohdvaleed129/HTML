<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
    <style>
        :root{
            --body-color: #e4e9f7;
            --sidebar-color: #fff;
            --primary-color: #695cfe;
            --primary-color-light: #f6f5ff;
            --toggle-color: #DDD;
            --text-color: #707070;
            --tran-03: all 0.2 ease;
            --tran-04: all 0.3 ease;
            --tran-05: all 0.4 ease;
            --tran-06: all 0.5 ease;
        }
        body{
            height: 100vh;
            background: var(--body-color);
        }
        .sidebar .text{
            font-size: 16px;
            font-weight: 500;
        }
        .sidebar .image{
            min-width: 10px;
            display: flex;
            align-items: center;
        }
        .sidebar{
            position: fixed;
            padding: 10px 14px;
            top: 0;
            left: 0;
            height: 100%;
            width: 250px;
            background: var(--sidebar-color);
        }
        .sidebar li{
            height: 50px;
            margin-top: 10px;
            list-style: none;
            display: flex;
            align-items: center;
        }
        .sidebar header{
            position: relative;
        }
        .sidebar .image-text img{
            width: 40px;
        }
        .sidebar header .image-text{
            display: flex;
            align-items: center;
        }
        header .image-text .header-text{
            display: flex;
            flex-direction: column;
        }
        .header-text .name{
            font-weight: 600;
        }
        .sidebar header .toggle{
            position: absolute;
            top: 50%;
            right: -25px;
            transform: translateY(-50%);
            height: 25px;
            width: 25px;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .sidebar li a{
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin-bottom: 3px;
            padding: 2px;
            
        }
        .sidebar li a :hover{
            background: var(--primary-color-light);
            background-color: gray;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="logo.jpeg" alt="Logo">
                </span>
                <div class="text header-text">
                    <span class="name">Argon Dashboard 2 Pro</span>
                </div>
            </div>
            <i class='bx bx-chevron-right toggle'></i>
        </header>
        <div class="menu-bar">
            <div class="menu">
                <ul>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx bx-desktop'></i>
                            <span class="text nav-text">Dashboard</span>
                        </a>
                    </li>
                    <li class="mb-3">
                        <a href="#" class="flex items-center p-2 text-gray-300 hover:bg-gray-700 rounded">
                            <i class='bx bxs-calendar'></i>
                            Tables
                        </a>
                    </li>
                    <li class="mb-3">
                        <a href="#" class="flex items-center p-2 text-gray-300 hover:bg-gray-700 rounded">
                            <i class='bx bx-credit-card'></i>
                            Biling
                        </a>
                    </li>
                    <li class="mb-3">
                        <a href="#" class="flex items-center p-2 text-gray-300 hover:bg-gray-700 rounded">
                            <span class="material-icons-sharp pr-3">
                                view_in_ar
                                </span>
                            Virtual Reality
                        </a>
                    </li>
                    <li class="mb-3">
                        <a href="#" class="flex items-center p-2 text-gray-300 hover:bg-gray-700 rounded">
                            <span class="material-icons-sharp pr-3">
                                language
                                </span>
                                RTL
                        </a>
                    </li>
                    <p class="p-4 text-sm text-gray-500">ACCOUNT PAGES</p>
                    <li class="mb-3">
                        <a href="#" class="flex items-center p-2 text-gray-300 hover:bg-gray-700 rounded">
                            <span class="material-icons-sharp pr-3">
                                person
                                </span>
                            Profile
                        </a>
                    </li>
                    <li class="mb-3">
                        <a href="#" class="flex items-center p-2 text-gray-300 hover:bg-gray-700 rounded">
                            <span class="material-icons-sharp pr-3">
                                login
                                </span>
                            Sign In
                        </a>
                    </li>
                    <li class="mb-3">
                        <a href="#" class="flex items-center p-2 text-gray-300 hover:bg-gray-700 rounded">
                            <span class="material-icons-sharp pr-3">
                                logout
                                </span>
                                Sign Up
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
