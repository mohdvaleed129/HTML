<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <style>
        body{
            background-color: rgb(0, 255, 229)
        }
    </style>
</head>
<body>
    <br>
    <br>
    <form>
        <label>First Name :</label>
        <input type="text" name="firstname" class="first"><br><br>
        <label>Middle Name :</label>
        <input type="text" name="middlename" class="first"><br><br>
        <label>Last Name :</label>
        <input type="text" name="lastname" class="first"><br><br>
        <label>Course</label>
        <select>
            <option>Course</option>
            <option>B.tech</option>
            <option>M.tech</option>
            <option>B.C.A</option>
            <option>B.B.A</option>
            <option>M.C.A</option>
            <option>M.B.A</option>
            <option>B.Pharma</option>
            <option>M.Pharma</option>
        </select>
        <br>
        <br>
        <label>Gender :</label><ul>
        <li><input type="radio" name="gender">Male<br></li>
        <li><input type="radio" name="gender">Female<br></li>
        <li><input type="radio" name="gender">Other<br></li>
        <br>
        </ul>
        <label>Phone No.</label>
        <select>
            <option>+91</option>
            <option>+971</option>
            <option>+744</option>
            <option>+121</option>
            <option>+671</option>
            <option>+871</option>
            <option>+921</option>
            <option>+323</option>
            <option>+763</option>
        </select>
        <input type="text" name="phone" size="10">
        <br>
        <br>
        <label>Address :</label><br>
        <textarea cols="80" rows="4" value="address" class="addr"></textarea><br><br>
        <label>Email :</label>
        <input type="text" class="em"><br><br>
        <label>Password :</label>
        <input type="text" class="pass"><br><br>
        <label>Retype-password :</label>
        <input type="text" class="repass"><br><br>
        <button>Submit</button>
    </form>
</body>
</html>
