<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <style>
        .add_to_cart-button{
            background-color : yellow;
            color : black;
            border : none;
            height :30px;
            width : 160px;
            border-radius : 18px;
            cursor : pointer;
            font-size: small;
            font-weight  : bold;
        }
        .add_to_cart-button:hover{
            background-color : rgb(255, 196, 0);
        }
        .buynow{
            background-color: orange;
        }
    </style>
</head>
<body>
    <p>Adults Plain Cotton T-shirt</p>
    <p>Price: $7.99</p>
    <button class ="add_to_cart-button" onclick="alert('Added')">Add to Cart</button>
    <button class="buynow" onclick="
    alert('Loading...');
    alert('Purchased');
     ">Buy now</button>
    <script>
        alert('Welcome');
    </script>
</body>
</html>
