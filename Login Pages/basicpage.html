<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: green cover;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
            z-index: 999;
            background-image: url(hero-img.jpg);
            overflow: hidden;
        }
        ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: rgb(255, 0, 0);
            font-weight: bold;
            font-size: large;
        }
        li{
            float: left;
        }
        li a{
            display: block;
            color: white;
            text-align: center;
            padding: 25px;
            text-decoration: none;
        }
        li a:hover{
            background-color: rgb(99, 0, 0);
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .container::before{
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .container .content{
            position: absolute;
            display: inline-block;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-shadow: 0 40px 50px;
            width: 300px;
            height: 220px;
            border-radius: 10px;
            background-color: rgb(255, 0, 0);
        }
        .container h2{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        form{
            font-weight: bolder;
            font-size: large;
        }
        button{
            margin-left: 120px;
            margin-top: 25px;
            padding-left: 18px;
            padding-right: 18px;
            padding-top: 10px;
            padding-bottom: 10px;
            background-color: black;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .forgot{
            font-size: small;
            position: absolute;
            max-width: 100%;
            margin-left: 210px;
            color: black;
        }
        .forgot:hover{
            color: blue;
        }
        .forgot:active{
            color: black;
        }
        .name,.psw{
            font-family: italic;
            font-size: large;
            margin-top: 15px;
        }
        input{
            width: 100%;
            height: 25px;
            border: none;
            border-radius: 4px;
            padding: 4px;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="default.asp">Home</a></li>
                <li><a href="news.asp">News</a></li>
                <li><a href="contact.asp">Contact</a></li>
                <li><a href="about.asp">About</a></li>
              </ul>
        </nav>
    </header>
    </nav>
    <div class="container">
        <div class="content">
            <div class="heading">
                <h2>Login</h2>
            </div>
            <form>
                <div class="name">Username :</div>
                <input type="text" name="uname" placeholder="Enter username">
                <div class="psw">Password :</div>
                <input type="password" name="psw" placeholder="Enter password">
                <div>
                    <button type="submit">Login</button><br>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>
            </form>
            <footer>
                
            </footer>
        </div>
    </div>
</body>
</html>
