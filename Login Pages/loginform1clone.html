<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Clone</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            display: flex;
           align-items: center;
           justify-content: center;
           min-height: 100vh;
        }
        section{
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vh;
            height: 100vh;
        }
        section::before{
            position: absolute;
            width: 100%;
            height: 100%;
        }
        section .signin{
            position: absolute;
            display: flex;
            width: 400px;
            background-color: #444;
            z-index: auto;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 30px 40px rgb(0,0,0);
        }
    </style>
</head>
<body>
    <section>
        <div class="signin">
            <div class="content">
                <h2>Sign In</h2>
                <div class="form">
                    <div class="inputbox">
                        <input type="text" placeholder="Username" required>
                        <i>Username</i>
                    </div>
                    <div class="inputbox">
                        <input type="password" placeholder="password" required>
                        <i>Password</i>
                    </div>
                    <div class="links">
                        <a href="#">Forgot password</a>
                        <a href="#">Sing up</a>
                    </div>
                    <div class="inputbox">
                        <input type="submit" value="Login">
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
