<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #999;
        }
        section 
        {
            position: absolute;
            width: 100vh;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        section::before{
            position: absolute;
            width: 100%;
            height: 100%;
        }
        section .signin
        {
            position: absolute;
            width: 400px;
            background: #999;  
            z-index: 1000;
            display: flex;
            display: flex;
            align-items: center;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 5px 15px 40px rgba(0,0,0,9);
        }
        section .signin .content 
        {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 40px;
        }
        section .signin .content h2 
        {
            font-size: 2em;
            color: #0f0;
            text-transform: uppercase;
        }
        section .signin .content .form 
        {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        section .signin .content .form .inputBox
        {
            position: relative;
            width: 100%;
        }
        section .signin .content .form .inputbox input 
        {
            position: relative;
            width: 100%;
            background: #333;
            border: none;
            outline: none;
            padding: 25px 10px 7.5px;
            border-radius: 4px;
            color: #fff;
            font-weight: 500;
            font-size: 1em;
        
        }
        section .signin .content .form .inputbox i 
        {
          position: absolute;
          left: 0;
          padding: 15px 10px;
          font-style: normal;
          color: #aaa;
          transition: 0.5s;
          pointer-events: none;
        }
        .signin .content .form .inputbox input:focus ~ i,
        .signin .content .form .inputbox input:valid ~ i
        {
          transform: translateY(-7.5px);
          font-size: 0.8em;
          color: #fff;
        }
        .signin .content .form .links 
        {
          position: relative;
          width: 100%;
          display: flex;
          justify-content: space-between;
        }
        .signin .content .form .links a 
        {
          color: #fff;
          text-decoration: none;
        }
        .signin .content .form .links a:nth-child(2)
        {
          color: #0f0;
          font-weight: 600;
        }
        .signin .content .form .inputbox input[type="submit"]
        {
          padding: 10px;
          background: #0f0;
          color: #000;
          font-weight: 600;
          font-size: 1.35em;
          letter-spacing: 0.05em;
          cursor: pointer;
        }
        input[type="submit"]:active
        {
          opacity: 0.6;
        }
        @media (max-width: 900px)
        {
          section span 
          {
            width: calc(10vw - 2px);
            height: calc(10vw - 2px);
          }
        }
        @media (max-width: 600px)
        {
          section span 
          {
            width: calc(20vw - 2px);
            height: calc(20vw - 2px);
          }
        }
    </style>
</head>
<body>
    <section>
        <div class="signin">
            <div class="content">
                <h2>Sign In</h2>
                <div class="form">
                    <div class="inputbox">
                        <input type="text" required>
                        <i>Username</i>
                    </div>
                    <div class="inputbox">
                        <input type="password" required>
                        <i>Password</i>
                    </div>
                    <div class="links">
                        <a href="#">Forgot password</a>
                        <a href="#">Signup</a>
                    </div>
                    <div class="inputbox">
                        <input type="submit" value="Login">
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
