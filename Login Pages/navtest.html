<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2035 Hyper-Quantum Navbar</title>
    <style>
        :root {
            --bg-color: #030307;
            --glass-bg: rgba(10, 10, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow-primary: #00f2fe;
            --glow-secondary: #4facfe;
            --glow-accent: #7f00ff;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --noise-svg: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.80' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-family);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(79, 172, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(127, 0, 255, 0.07) 0%, transparent 45%);
        }

        /* --- CONTAINER & PERSPECTIVE WRAPPER --- */
        .nav-space {
            width: 100%;
            padding: 24px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            perspective: 1200px;
        }

        /* --- THE CORE NAVBAR PANEL --- */
        nav {
            max-width: 1320px;
            margin: 0 auto;
            height: 74px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border-radius: 40px;
            padding: 0 12px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(0);
            animation: navFloat 6s ease-in-out infinite;
            
            /* Layered 3D Shadows & Inner Ambient Glows */
            box-shadow: 
                0 0 0 1px var(--glass-border),
                inset 0 1px 2px rgba(255, 255, 255, 0.15),
                inset 0 -1px 3px rgba(0, 0, 0, 0.4),
                0 4px 30px rgba(0, 0, 0, 0.4),
                0 20px 50px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(0, 242, 254, 0.03);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1), backdrop-filter 0.4s;
        }

        nav:hover {
            transform: scale3d(1.01, 1.01, 1.01) translateY(2px);
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.12),
                inset 0 1px 3px rgba(255, 255, 255, 0.25),
                inset 0 -1px 3px rgba(0, 0, 0, 0.4),
                0 10px 40px rgba(0, 0, 0, 0.5),
                0 30px 70px rgba(0, 0, 0, 0.4),
                0 0 50px rgba(0, 242, 254, 0.06);
        }

        /* Noise Texture Overlay */
        nav::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 40px;
            background-image: var(--noise-svg);
            opacity: 0.018;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 1;
        }

        /* 360° Chromatic Moving Border Accent */
        nav::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 42px;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 120deg, var(--glow-primary) 180deg, var(--glow-accent) 240deg, transparent 300deg, transparent 360deg);
            animation: chromaticRotate 8s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.4;
            z-index: -1;
        }

        /* --- LOGO ENGINE --- */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.2),
                0 2px 8px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .logo::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--glow-primary), var(--glow-accent));
            padding: 1px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0.6;
            animation: spin 4s linear infinite;
            z-index: 2;
        }

        .logo::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-primary) 0%, transparent 70%);
            opacity: 0;
            filter: blur(4px);
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        .logo img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            position: relative;
            z-index: 3;
            transform: translateZ(10px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s;
        }

        .logo:hover {
            transform: rotate3d(1, 1, 1, 15deg) scale(1.05);
        }

        .logo:hover::after {
            opacity: 0.4;
        }

        .logo:hover img {
            filter: drop-shadow(0 0 6px var(--glow-primary));
        }

        /* --- NAVIGATION LINKS --- */
        .nav-links {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateZ(5px);
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px;
            border-radius: 30px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .nav-links li {
            position: relative;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 10px 18px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: color 0.3s, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
        }

        /* Micro-movement and text glow on hover */
        .nav-links li:hover a {
            color: var(--text-main);
            transform: translateY(-2px) translateZ(5px);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        /* Animated Magnetic Underline Sub-element */
        .nav-links a::after {
            content: "";
            position: absolute;
            bottom: 2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--glow-primary), transparent);
            transform: translateX(-50%);
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 0 3px var(--glow-primary));
        }

        .nav-links li:hover a::after {
            width: 60%;
        }

        /* --- THE 2035 "HIRE ME" PRESTIGE BUTTON --- */
        #hire-btn {
            position: relative;
            height: 50px;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.03);
            border: none;
            border-radius: 25px;
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-decoration: none;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transform: translateZ(8px);
            
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                0 4px 12px rgba(0, 0, 0, 0.3);
            transition: 
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.3s;
        }

        /* Breathing Ambient Inner Glow */
        #hire-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(127, 0, 255, 0.15));
            opacity: 0.6;
            animation: pulseGlow 3s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* Moving Linear Specular Shine Reflection */
        #hire-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25) 30%,
                rgba(255, 255, 255, 0.5) 50%,
                rgba(255, 255, 255, 0.25) 70%,
                transparent
            );
            transform: skewX(-25deg);
            transition: none;
            z-index: 2;
        }

        /* Button Hover and Interaction Engine */
        #hire-btn:hover {
            transform: translateZ(15px) scale(1.03);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 
                0 0 0 1px rgba(0, 242, 254, 0.3),
                0 0 25px rgba(0, 242, 254, 0.2),
                0 10px 20px rgba(0, 0, 0, 0.4);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        #hire-btn:hover::after {
            animation: sweepShine 1.3s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        /* Click Press Feedback Architecture */
        #hire-btn:active {
            transform: translateZ(4px) scale(0.97);
            box-shadow: 
                0 0 0 1px rgba(0, 242, 254, 0.5),
                0 0 12px rgba(0, 242, 254, 0.3),
                inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* --- PROCEDURAL CINEMATIC ANIMATIONS --- */
        @keyframes navFloat {
            0% { transform: translateZ(0) translateY(0px) rotateX(0deg); }
            50% { transform: translateZ(10px) translateY(-5px) rotateX(1deg); }
            100% { transform: translateZ(0) translateY(0px) rotateX(0deg); }
        }

        @keyframes chromaticRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes sweepShine {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; filter: saturate(100%); }
            100% { opacity: 0.8; filter: saturate(180%); }
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 992px) {
            .nav-links {
                display: none; /* Designed to switch into a full-screen dynamic matrix overlay on tap */
            }
            .nav-space {
                padding: 12px;
            }
            nav {
                height: 64px;
                padding: 0 8px 0 12px;
                border-radius: 32px;
            }
            nav::after {
                border-radius: 34px;
            }
            #hire-btn {
                height: 42px;
                padding: 0 18px;
                font-size: 0.8rem;
                border-radius: 21px;
            }
        }
    </style>
</head>
<body>

    <div class="nav-space">
        <nav>
            <div class="logo">
                <img src="assets/images/logo.png" alt="System Node Access">
            </div>
            
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#achievements">Hackathons</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            
            <a id="hire-btn" href="assets/Final Resume.pdf" target="_blank" class="btn-primary">
                Hire Me
            </a>
        </nav>
    </div>

</body>
</html>
