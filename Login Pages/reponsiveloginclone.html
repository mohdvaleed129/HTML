<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive login Clone</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        section{
            position :absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vh;
            height: 100vh;
        }
        section::before{
            position: absolute;
            width: 100%;
            height: 100%;
        }
        section .form{
            position: absolute;
            z-index: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 400px;
            background-color: #444;
            padding: 40px;
            box-shadow: 0 20px 40px 20px ;
            border-radius: 10px;
        }
        .form{
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <section>
    <div class="form">
        <div class="heading">
            <h2>Sign In</h2>
        </div>
        <div>
            <div class="inputbox">
                <b>Username</b>
                <input type="text" name="uname" required>
            </div>
            <div class="inputbox">
                <b>Password</b>
                <input type="password" name="psw" required>
            </div>
            <div>
                <div class="inputbox"></div>
                <input type="button" value="Login">
            </div>
        </div> 
    </div>
    </section>
</body>
</html>
