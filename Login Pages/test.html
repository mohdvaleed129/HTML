<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"scale":50,"speed":0.1,"density":20,"chaos":0};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 
                 const scale = addControl("scale", "System Scale", 50, 200, 100);
                 const speed = addControl("speed", "Processing Speed", 0.1, 3.0, 1.0);
                 const density = addControl("density", "Network Density", 1, 20, 8);
                 const chaos = addControl("chaos", "Entropy", 0.0, 1.0, 0.1);
                 
                 const n = i / count;
                 
                 const h1 = (Math.sin(i * 12.9898) * 43758.5453) % 1.0;
                 const h2 = (Math.cos(i * 78.2330) * 29183.1928) % 1.0;
                 const r1 = Math.abs(h1);
                 const r2 = Math.abs(h2);
                 
                 const isOuter = Math.floor(r1 + 0.75);
                 
                 const phiCore = Math.acos(1 - 2 * r1);
                 const thetaCore = 2 * Math.PI * r2 * density + time * speed * 0.5;
                 const coreMod = 1 + 0.3 * Math.sin(phiCore * 6 + time * speed) * Math.cos(thetaCore * 4);
                 const rCore = scale * 0.35 * coreMod;
                 
                 const cx = rCore * Math.sin(phiCore) * Math.cos(thetaCore);
                 const cy = rCore * Math.cos(phiCore);
                 const cz = rCore * Math.sin(phiCore) * Math.sin(thetaCore);
                 
                 const layer = Math.floor(r2 * density);
                 const twist = Math.sin(r1 * Math.PI) * 2.0;
                 const spindleAngle = (n * Math.PI * 2 * density) + (layer * 0.5) + (time * speed * 0.2) + twist;
                 const spindleRadius = scale * 0.5 + (layer * scale * 0.06);
                 
                 const flowPhase = (r1 + time * speed * 0.05) % 1.0;
                 const sy = (flowPhase - 0.5) * scale * 2.8;
                 const taper = Math.pow(Math.sin(flowPhase * Math.PI), 0.5);
                 
                 const sx = Math.cos(spindleAngle) * spindleRadius * taper;
                 const sz = Math.sin(spindleAngle) * spindleRadius * taper;
                 
                 let x = cx * (1 - isOuter) + sx * isOuter;
                 let y = cy * (1 - isOuter) + sy * isOuter;
                 let z = cz * (1 - isOuter) + sz * isOuter;
                 
                 x += (h1 - 0.5) * scale * chaos;
                 y += (h2 - 0.5) * scale * chaos;
                 z += ((h1 * h2) % 1.0 - 0.5) * scale * chaos;
                 
                 target.set(x, y, z);
                 
                 const baseHue = 0.55 + isOuter * 0.25;
                 const hueOffset = (r1 * 0.1) - 0.05;
                 
                 const packetSync = isOuter ? (flowPhase * 50 - time * speed * 8) : (phiCore * 10 - time * speed * 5);
                 const flash = Math.pow((Math.sin(packetSync) + 1) * 0.5, 30);
                 
                 const lightness = 0.2 + (flash * 0.7) + ((1 - isOuter) * 0.2);
                 const saturation = 0.8 + (flash * 0.2);
                 
                 color.setHSL(baseHue + hueOffset, saturation, lightness);
                 
                 if (i === 0) {
                     setInfo("AI Cognition Matrix", "Real-time computational latency and throughput visualization.");
                     annotate("core_lbl", new THREE.Vector3(0, scale * 0.4, 0), "Quantum Latent Core");
                     annotate("path_lbl", new THREE.Vector3(scale * 0.8, scale * 1.2, 0), "Deep Feed-Forward Spindle");
                 }
                 
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
